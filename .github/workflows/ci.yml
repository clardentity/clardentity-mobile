name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint . --max-warnings 50

      - name: Unit tests
        run: npm test -- --ci

      - name: Expo config resolves
        run: npx expo config --type public > /dev/null

      - name: Bundle iOS and Android
        run: npx expo export --platform ios --platform android --output-dir dist

  # Push to main, checks green -> an over-the-air update on the production
  # channel. Reaches only store builds with the same native fingerprint (see
  # app.config.js); native changes still need `eas build` + `eas submit`.
  # Needs the repository secret EXPO_TOKEN (the project id is in app.json);
  # skipped until it exists so forks and fresh clones don't fail.
  deploy-update:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: eas-update-production
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # `eas update` bundles with this environment, not eas.json's build env,
      # so the backend URL is repeated here.
      EXPO_PUBLIC_BACKEND_URL: https://clardentity-backend.onrender.com
    steps:
      - name: Skip without Expo credentials
        if: env.EXPO_TOKEN == ''
        run: echo "::notice::EXPO_TOKEN is not set - skipping the OTA update."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        if: env.EXPO_TOKEN != ''

      - name: Publish update to production
        if: env.EXPO_TOKEN != ''
        # Via env, not ${{ }} in the script: a commit message is untrusted
        # text and would otherwise be pasted into the shell.
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          eas update --channel production --platform all --non-interactive \
            --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
